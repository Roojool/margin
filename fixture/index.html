<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Field Supply — test fixture</title
  ><link rel="stylesheet" href="/style.css" />
  <body>
    <main class="fixture">
      <p class="eyebrow">Field Supply / local test fixture</p>
      <h1>A place for<br />your next idea.</h1>
      <article class="product">
        <span class="notebook" aria-hidden="true"
          >FIELD<br />NOTES<br /><small>No. 01</small></span
        >
        <div>
          <h2>Field notebook</h2>
          <p>Uncoated paper. Thread binding. Made to be used.</p>
          <p>₹240 / notebook</p>
          <button id="add">Add to basket</button>
        </div>
      </article>
      <p role="status" aria-label="Basket">0 notebooks · ₹0</p>
      <button id="order" disabled>Place order</button>
      <p role="status" aria-label="Order">No order yet</p>
    </main>
    <script src="/fixture.js"></script>
  </body>
</html>
